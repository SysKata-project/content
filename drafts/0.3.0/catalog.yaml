- kind: exercise
  id: oc-declarative.apply
  revision: 1
  type: command_entry
  skill_ids: *id013
  objective_ids:
  - objective.oc-declarative
  prompt: Apply web.yaml to the current assigned project with oc apply -f. Enter only the requested command;
    literal spelling and spacing are checked, ignoring leading/trailing spaces.
  hints:
  - id: hint.reason
    text: Use the manifest filename.
  source: *id014
  assessment:
    evaluator: command.literal
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.apply
      misconception_code: misconception.create-is-reconcile
      explanation: Apply reconciles the manifest; verify the resulting Deployment rather than assuming
        command success proves readiness.
      reference_ids: *id015
    reveal_markdown: Use `oc apply -f web.yaml`. Apply reconciles the manifest; verify the resulting Deployment
      rather than assuming command success proves readiness.
    normalization: literal-command-v1
    accepted_commands:
    - oc apply -f web.yaml
- kind: exercise
  id: oc-declarative.verify
  revision: 1
  type: single_choice
  skill_ids: *id013
  objective_ids:
  - objective.oc-declarative
  prompt: oc apply reports configured. What proves the latest Deployment has converged?
  hints:
  - id: hint.reason
    text: Compare desired generation with observed status.
  source: *id014
  assessment:
    evaluator: choice.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.verify
      misconception_code: misconception.accepted-is-ready
      explanation: Check that the current generation is observed and the desired updated replicas are
        ready; accepting a manifest is not rollout completion.
      reference_ids: *id015
    reveal_markdown: Check that the current generation is observed and the desired updated replicas are
      ready; accepting a manifest is not rollout completion.
    correct_option_id: status
  options:
  - id: status
    text: Inspect current generation and updated ready replicas
  - id: accepted
    text: The configured message alone
  - id: file
    text: The file exists locally
- kind: exercise
  id: oc-declarative.workflow
  revision: 1
  type: command_order
  skill_ids: *id013
  objective_ids:
  - objective.oc-declarative
  prompt: Order a safe manifest update workflow.
  hints:
  - id: hint.reason
    text: Inspect before changing and observe afterward.
  source: *id014
  assessment:
    evaluator: order.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.workflow
      misconception_code: misconception.blind-apply
      explanation: Confirm assigned scope, inspect the resource, apply the intended manifest and verify
        the resulting state.
      reference_ids: *id015
    reveal_markdown: Confirm assigned scope, inspect the resource, apply the intended manifest and verify
      the resulting state.
    correct_order:
    - scope
    - inspect
    - apply
    - verify
  steps:
  - id: verify
    text: Verify rollout and desired fields
  - id: apply
    text: Apply the edited manifest
  - id: inspect
    text: Inspect the existing Deployment
  - id: scope
    text: Confirm the assigned project
- kind: exercise
  id: oc-declarative.drift
  revision: 1
  type: single_choice
  skill_ids: *id013
  objective_ids:
  - objective.oc-declarative
  prompt: Your file requests one replica, but a later imperative change sets two. What does reapplying
    that file intend?
  hints:
  - id: hint.reason
    text: The file declares a desired replica count.
  source: *id014
  assessment:
    evaluator: choice.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.drift
      misconception_code: misconception.file-tracks-live
      explanation: The manifest still declares one replica. Reapplying reconciles that declared field;
        inspect the result and keep intended changes in the manifest.
      reference_ids: *id015
    reveal_markdown: The manifest still declares one replica. Reapplying reconciles that declared field;
      inspect the result and keep intended changes in the manifest.
    correct_option_id: one
  options:
  - id: one
    text: Restore the declared replica count of one
  - id: two
    text: Automatically rewrite the file to two
  - id: delete
    text: Delete the project
- kind: exercise
  id: oc-rbac.scope
  revision: 1
  type: single_choice
  skill_ids: *id016
  objective_ids:
  - objective.oc-rbac
  prompt: A supplied identity must list pods in this project only. Which grant fits?
  hints:
  - id: hint.reason
    text: Grant only the required resource and verbs.
  source: *id017
  assessment:
    evaluator: choice.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.scope
      misconception_code: misconception.reader-means-admin
      explanation: Use a namespaced Role for pod get/list and a RoleBinding to the exact supplied subject.
        Do not grant cluster-admin or secret access.
      reference_ids: *id018
    reveal_markdown: Use a namespaced Role for pod get/list and a RoleBinding to the exact supplied subject.
      Do not grant cluster-admin or secret access.
    correct_option_id: role
  options:
  - id: role
    text: A pod get/list Role and namespaced RoleBinding
  - id: admin
    text: A cluster-admin binding
  - id: secret
    text: A Role that can read every resource including secrets
- kind: exercise
  id: oc-rbac.self-check
  revision: 1
  type: command_entry
  skill_ids: *id016
  objective_ids:
  - objective.oc-rbac
  prompt: Check whether your current identity may delete pods in the current project using oc auth can-i.
    Enter only the requested command; literal spelling and spacing are checked, ignoring leading/trailing
    spaces.
  hints:
  - id: hint.reason
    text: Ask about the exact verb and resource.
  source: *id017
  assessment:
    evaluator: command.literal
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.self-check
      misconception_code: misconception.own-check-is-subject-proof
      explanation: This checks the current identity only. A trusted operator must test the supplied identity
        separately; learner impersonation is not granted.
      reference_ids: *id018
    reveal_markdown: Use `oc auth can-i delete pods`. This checks the current identity only. A trusted
      operator must test the supplied identity separately; learner impersonation is not granted.
    normalization: literal-command-v1
    accepted_commands:
    - oc auth can-i delete pods
- kind: exercise
  id: oc-rbac.subject
  revision: 1
  type: single_choice
  skill_ids: *id016
  objective_ids:
  - objective.oc-rbac
  prompt: The Role is correct but supplied-reader still cannot list pods. The binding names another ServiceAccount.
    What must be fixed?
  hints:
  - id: hint.reason
    text: A role does not choose its subjects.
  source: *id017
  assessment:
    evaluator: choice.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.subject
      misconception_code: misconception.role-alone-grants
      explanation: Bind the correct supplied ServiceAccount name and namespace. The Role defines permissions;
        the RoleBinding assigns them.
      reference_ids: *id018
    reveal_markdown: Bind the correct supplied ServiceAccount name and namespace. The Role defines permissions;
      the RoleBinding assigns them.
    correct_option_id: subject
  options:
  - id: subject
    text: Correct the binding subject name and namespace
  - id: secret
    text: Give the learner the operator token
  - id: global
    text: Create a ClusterRoleBinding
- kind: exercise
  id: oc-rbac.proof
  revision: 1
  type: command_order
  skill_ids: *id016
  objective_ids:
  - objective.oc-rbac
  prompt: Order scoped access validation after applying the Role and RoleBinding.
  hints:
  - id: hint.reason
    text: A positive test alone cannot prove least privilege.
  source: *id017
  assessment:
    evaluator: order.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.proof
      misconception_code: misconception.allow-only-proof
      explanation: Use the supplied identity through the trusted harness; establish pod reads, reject
        pod deletion and secret reads, and reject cross-project access.
      reference_ids: *id018
    reveal_markdown: Use the supplied identity through the trusted harness; establish pod reads, reject
      pod deletion and secret reads, and reject cross-project access.
    correct_order:
    - identity
    - allow
    - deny
    - foreign
  steps:
  - id: foreign
    text: Verify pod list in another project is denied
  - id: deny
    text: Verify delete pods and get secrets are denied
  - id: allow
    text: Verify pod list succeeds in assigned project
  - id: identity
    text: Trusted harness selects supplied identity
- kind: exercise
  id: oc-budgets.inspect
  revision: 1
  type: command_entry
  skill_ids: *id019
  objective_ids:
  - objective.oc-budgets
  prompt: Inspect exercise-budget usage and limits using oc describe resourcequota. Enter only the requested
    command; literal spelling and spacing are checked, ignoring leading/trailing spaces.
  hints:
  - id: hint.reason
    text: Describe the named quota.
  source: *id020
  assessment:
    evaluator: command.literal
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.inspect
      misconception_code: misconception.quota-is-per-pod
      explanation: A ResourceQuota bounds aggregate namespace usage for its listed resources. Inspect
        used and hard values to explain a rejection.
      reference_ids: *id021
    reveal_markdown: Use `oc describe resourcequota exercise-budget`. A ResourceQuota bounds aggregate
      namespace usage for its listed resources. Inspect used and hard values to explain a rejection.
    normalization: literal-command-v1
    accepted_commands:
    - oc describe resourcequota exercise-budget
- kind: exercise
  id: oc-budgets.intersection
  revision: 1
  type: single_choice
  skill_ids: *id019
  objective_ids:
  - objective.oc-budgets
  prompt: The outer quota allows four pods; exercise-budget allows one. One pod already exists. Can a
    second pod be admitted?
  hints:
  - id: hint.reason
    text: All applicable quotas must permit admission.
  source: *id020
  assessment:
    evaluator: choice.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.intersection
      misconception_code: misconception.quota-adds-capacity
      explanation: No. Both quotas apply; adding a quota does not add capacity or replace the operator
        ceiling.
      reference_ids: *id021
    reveal_markdown: No. Both quotas apply; adding a quota does not add capacity or replace the operator
      ceiling.
    correct_option_id: 'no'
  options:
  - id: 'no'
    text: No; the exercise quota is already exhausted
  - id: five
    text: Yes; limits add up to five
  - id: outer
    text: Yes; only the outer quota applies
- kind: exercise
  id: oc-budgets.denial
  revision: 1
  type: single_choice
  skill_ids: *id019
  objective_ids:
  - objective.oc-budgets
  prompt: 'Creating a second pod returns Forbidden with exceeded quota: exercise-budget. What does this
    evidence show?'
  hints:
  - id: hint.reason
    text: Read the reason, not only the HTTP status.
  source: *id020
  assessment:
    evaluator: choice.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.denial
      misconception_code: misconception.all-forbidden-is-rbac
      explanation: This is quota admission denial. Compare requested resources and used/hard values; a
        larger role does not fix exhausted quota.
      reference_ids: *id021
    reveal_markdown: This is quota admission denial. Compare requested resources and used/hard values;
      a larger role does not fix exhausted quota.
    correct_option_id: quota
  options:
  - id: quota
    text: The request exceeded the named resource budget
  - id: rbac
    text: The identity necessarily lacks create permission
  - id: network
    text: DNS is unavailable
- kind: exercise
  id: oc-budgets.ceiling
  revision: 1
  type: single_choice
  skill_ids: *id019
  objective_ids:
  - objective.oc-budgets
  prompt: The exercise needs adjustment, but the operator-owned outer quota is fixed. What is permitted?
  hints:
  - id: hint.reason
    text: Work only within delegated exercise controls.
  source: *id020
  assessment:
    evaluator: choice.exact
    evaluator_version: 1
    completion_evidence: correct-response
    feedback:
    - criterion_id: criterion.ceiling
      misconception_code: misconception.quota-replaces-isolation
      explanation: Adjust only the delegated exercise quota within the assignment. The operator ceiling
        and network isolation remain protected; do not remove them.
      reference_ids: *id021
    reveal_markdown: Adjust only the delegated exercise quota within the assignment. The operator ceiling
      and network isolation remain protected; do not remove them.
    correct_option_id: exercise
  options:
  - id: exercise
    text: Adjust the delegated exercise quota within the assignment
  - id: outer
    text: Delete the outer quota
  - id: policy
    text: Remove network policies
